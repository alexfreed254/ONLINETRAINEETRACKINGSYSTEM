{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block guest_content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg">
        <i class="fas fa-key text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white">Forgot Password?</h1>
      <p class="text-slate-400 text-sm mt-1">Enter your email and we will send a reset link</p>
    </div>
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <form method="POST" class="space-y-4">
        <div>
          <label class="form-label">Email Address</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-slate-400"><i class="fas fa-envelope text-sm"></i></span>
            <input type="email" name="email" required class="form-input pl-9" placeholder="your@email.com">
          </div>
        </div>
        <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors">
          <i class="fas fa-paper-plane mr-2"></i>Send Reset Link
        </button>
      </form>
      <p class="text-center text-sm text-slate-500 mt-4">
        <a href="{{ url_for('auth.trainee_login') }}" class="text-blue-600 font-medium hover:underline">
          <i class="fas fa-arrow-left mr-1"></i>Back to Login
        </a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
