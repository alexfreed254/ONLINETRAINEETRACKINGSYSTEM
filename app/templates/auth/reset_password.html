{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block guest_content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg">
        <i class="fas fa-lock text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white">Set New Password</h1>
      <p class="text-slate-400 text-sm mt-1">Choose a strong password for your account</p>
    </div>
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <form method="POST" id="reset-form" class="space-y-4">
        <input type="hidden" name="access_token" id="access_token_field" value="{{ access_token }}">
        <div>
          <label class="form-label">New Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-slate-400"><i class="fas fa-lock text-sm"></i></span>
            <input type="password" name="password" id="pw1" required class="form-input pl-9" placeholder="Min 8 characters">
          </div>
        </div>
        <div>
          <label class="form-label">Confirm Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-slate-400"><i class="fas fa-lock text-sm"></i></span>
            <input type="password" name="confirm_password" id="pw2" required class="form-input pl-9" placeholder="Repeat password">
          </div>
          <p id="match-msg" class="text-xs mt-1 hidden"></p>
        </div>
        <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors">
          <i class="fas fa-check mr-2"></i>Update Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
// Extract token from URL hash (Supabase sends it as #access_token=...)
const hash = window.location.hash;
if (hash) {
  const params = new URLSearchParams(hash.substring(1));
  const token = params.get('access_token');
  if (token) document.getElementById('access_token_field').value = token;
}
const pw1 = document.getElementById('pw1');
const pw2 = document.getElementById('pw2');
const msg = document.getElementById('match-msg');
function check() {
  if (!pw2.value) { msg.classList.add('hidden'); return; }
  if (pw1.value === pw2.value) { msg.textContent = '✓ Passwords match'; msg.className = 'text-xs text-emerald-600'; }
  else { msg.textContent = '✗ Passwords do not match'; msg.className = 'text-xs text-red-500'; }
  msg.classList.remove('hidden');
}
pw1.addEventListener('input', check);
pw2.addEventListener('input', check);
</script>
{% endblock %}
