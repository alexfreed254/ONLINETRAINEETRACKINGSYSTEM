{% extends "base.html" %}
{% block title %}Employer Login{% endblock %}
{% block guest_content %}
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-emerald-900 to-slate-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <img src="{{ url_for('static', filename='images/logo.jpg') }}"
           alt="TTTI Logo"
           class="w-20 h-20 rounded-2xl object-cover shadow-xl border-2 border-white/20 mx-auto mb-3">
      <h1 class="text-2xl font-bold text-white">Employer Portal</h1>
      <p class="text-slate-400 text-sm mt-1">Sign in to verify and recommend trainees</p>
    </div>
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <h2 class="text-xl font-bold text-slate-800 mb-1">Welcome back</h2>
      <p class="text-slate-500 text-sm mb-6">Sign in with your company account</p>
      <form method="POST" class="space-y-4">
        <div>
          <label class="form-label">Official Email</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-slate-400"><i class="fas fa-envelope text-sm"></i></span>
            <input type="email" name="email" required class="form-input pl-9" placeholder="company@example.com">
          </div>
        </div>
        <div>
          <label class="form-label">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center text-slate-400"><i class="fas fa-lock text-sm"></i></span>
            <input type="password" name="password" id="emp-pw" required class="form-input pl-9 pr-10" placeholder="••••••••">
            <button type="button" onclick="togglePwd()" class="absolute inset-y-0 right-3 flex items-center text-slate-400 hover:text-slate-600">
              <i class="fas fa-eye text-sm" id="emp-pw-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg transition-colors">
          <i class="fas fa-sign-in-alt mr-2"></i>Sign In
        </button>
      </form>
      <div class="mt-4 pt-4 border-t border-slate-100 text-center space-y-2">
        <p class="text-sm text-slate-500">
          New employer?
          <a href="{{ url_for('employer.register') }}" class="text-emerald-600 font-medium hover:underline">Create account</a>
        </p>
        <p class="text-xs text-slate-400">
          <a href="{{ url_for('auth.login') }}" class="hover:text-slate-600">← Back to portal selector</a>
        </p>
      </div>
    </div>
  </div>
</div>
<script>
function togglePwd(){
  const i=document.getElementById('emp-pw');
  const ic=document.getElementById('emp-pw-icon');
  if(i.type==='password'){i.type='text';ic.classList.replace('fa-eye','fa-eye-slash');}
  else{i.type='password';ic.classList.replace('fa-eye-slash','fa-eye');}
}
</script>
{% endblock %}
