{% extends "base.html" %}
{% block title %}Post Job / Internship{% endblock %}
{% block page_title %}Post Job or Internship{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('employer.jobs') }}" class="btn-secondary text-xs"><i class="fas fa-arrow-left"></i> My Postings</a>
  </div>
  <div class="card p-6">
    <div class="flex items-center gap-3 mb-5">
      <div class="w-10 h-10 bg-emerald-100 rounded-xl flex items-center justify-center flex-shrink-0">
        <i class="fas fa-briefcase text-emerald-600"></i>
      </div>
      <div>
        <h2 class="text-base font-bold text-slate-800">Advertise a Vacancy</h2>
        <p class="text-xs text-slate-500">Visible to all trainees on the job board</p>
      </div>
    </div>
    <form method="POST" class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label class="form-label">Job / Vacancy Title <span class="text-red-500">*</span></label>
          <input type="text" name="title" required class="form-input" placeholder="e.g. Electrical Technician Intern, Junior Welder">
        </div>
        <div>
          <label class="form-label">Type <span class="text-red-500">*</span></label>
          <select name="type" class="form-input">
            <option value="job">Full-time Job</option>
            <option value="internship">Internship</option>
            <option value="attachment">Industrial Attachment</option>
            <option value="apprenticeship">Apprenticeship</option>
          </select>
        </div>
        <div>
          <label class="form-label">Location</label>
          <input type="text" name="location" class="form-input" placeholder="Nairobi, Thika, Remote...">
        </div>
        <div>
          <label class="form-label">Salary / Stipend Range</label>
          <input type="text" name="salary_range" class="form-input" placeholder="e.g. KES 15,000–25,000/month">
        </div>
        <div>
          <label class="form-label">Application Deadline</label>
          <input type="date" name="deadline" class="form-input">
        </div>
        <div>
          <label class="form-label">Number of Slots</label>
          <input type="number" name="slots" class="form-input" value="1" min="1" max="100">
        </div>
        <div>
          <label class="form-label">Preferred Department</label>
          <select name="department_preference" class="form-input">
            <option value="">Any Department</option>
            {% for dept in departments %}
            <option value="{{ dept.name }}">{{ dept.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div>
        <label class="form-label">Skills Required</label>
        <input type="text" name="skills_required" class="form-input" placeholder="Welding, AutoCAD, Python (comma-separated)">
        <p class="text-xs text-slate-400 mt-1">Separate skills with commas</p>
      </div>
      <div>
        <label class="form-label">Job Description <span class="text-red-500">*</span></label>
        <textarea name="description" rows="4" required class="form-input resize-none"
          placeholder="Describe the role, responsibilities, and what the trainee will be doing..."></textarea>
      </div>
      <div>
        <label class="form-label">Requirements / Qualifications</label>
        <textarea name="requirements" rows="3" class="form-input resize-none"
          placeholder="Minimum qualifications, experience, certifications needed..."></textarea>
      </div>
      <div class="flex gap-3 justify-end pt-2">
        <a href="{{ url_for('employer.jobs') }}" class="btn-secondary">Cancel</a>
        <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i> Publish Posting</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
